server {
    listen 80;
    server_name roiy.dev api.roiy.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS setup is in progress. Please try again shortly.\n";
    }
}