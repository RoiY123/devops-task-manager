# Per-client-IP allowance for login attempts; slows password guessing.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name roiy.dev api.roiy.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name roiy.dev api.roiy.dev;

    ssl_certificate /etc/letsencrypt/live/roiy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roiy.dev/privkey.pem;

    # Server level so every location below inherits them.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Prometheus scrapes the API directly on port 8000; metrics are never public.
    location /metrics {
        return 404;
    }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        # The default 503 would look like an outage.
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://api:8000;
    }
}
