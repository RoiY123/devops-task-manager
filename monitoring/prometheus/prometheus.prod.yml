global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets:
          - "app-prod:8000"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "app-prod:9100"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"