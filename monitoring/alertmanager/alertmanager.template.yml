global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "${ALERT_EMAIL}"
  smtp_auth_username: "${ALERT_EMAIL}"
  smtp_auth_password: "${ALERT_SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: "email"
  group_by:
    - alertname
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: "email"
    email_configs:
      - to: "${ALERT_EMAIL}"
        send_resolved: true