global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "${ALERT_EMAIL}"
  smtp_auth_username: "${ALERT_EMAIL}"
  smtp_auth_password: "${ALERT_SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: "email"
  group_by:
    - alertname
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

  routes:
    - receiver: "grafana-email"
      matchers:
        - 'service="rds"'

receivers:
  - name: "email"
    email_configs:
      - to: "${ALERT_EMAIL}"
        send_resolved: true

  - name: "grafana-email"
    email_configs:
      - to: "${ALERT_EMAIL}"
        send_resolved: true

        headers:
          Subject: '[{{ .Status | toUpper }}:{{ len .Alerts }}] {{ .CommonLabels.alertname }}'

        html: |
          <div style="background-color:#f5f5f5; padding:24px 0; font-family:Arial, sans-serif;">
            <div style="max-width:560px; margin:0 auto; background-color:#ffffff;">

              <div style="
                padding:18px 24px;
                text-align:center;
                color:#ffffff;
                font-size:18px;
                font-weight:bold;
                background-color:{{ if eq .Status "firing" }}#f04e23{{ else }}#34a853{{ end }};
              ">
                {{ len .Alerts }} alert for alertname={{ .CommonLabels.alertname }}
              </div>

              <div style="padding:24px 30px; color:#222222;">

                {{ range .Alerts }}

                <p style="font-size:16px; font-weight:bold; margin-top:0;">
                  [{{ if eq .Status "firing" }}!{{ else }}✓{{ end }}] {{ .Status | toUpper }}
                </p>

                <p>
                  <strong>Severity:</strong> {{ .Labels.severity }}<br>
                  <strong>Environment:</strong> {{ .Labels.environment }}<br>
                  <strong>Service:</strong> {{ .Labels.service }}
                </p>

                <p>
                  <strong>Summary</strong><br>
                  {{ .Annotations.summary }}
                </p>

                <p>
                  <strong>Description</strong><br>
                  {{ .Annotations.description }}
                </p>

                {{ end }}

              </div>
            </div>
          </div>