version: 2

updates:
  # Python application dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

    groups:
      python-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python base image
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

    allow:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-patch"

  # Images referenced by Docker Compose
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      compose-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

    groups:
      actions-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Terraform providers
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

    groups:
      terraform-routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"