name: CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/task_manager_test
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head
      
      - name: Run tests
        run: python -m pytest -v

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.prod.example -f compose.prod.yml config --quiet

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        if: >
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      COMMIT_SHA: ${{ github.sha }}
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::359642223744:role/task-manager-github-deploy
          aws-region: il-central-1
      
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve deployment values
        run: |
          APP_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=task-manager-prod-api" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          APP_PRIVATE_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=task-manager-prod-api" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          MONITORING_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=task-manager-prod-monitoring" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [[ -z "$APP_INSTANCE_ID" || "$APP_INSTANCE_ID" == "None" ]]; then
            echo "ERROR: Failed to resolve app EC2 instance ID."
            exit 1
          fi

          if [[ -z "$APP_PRIVATE_IP" || "$APP_PRIVATE_IP" == "None" ]]; then
            echo "ERROR: Failed to resolve app EC2 private IP."
            exit 1
          fi

          if [[ -z "$MONITORING_INSTANCE_ID" || "$MONITORING_INSTANCE_ID" == "None" ]]; then
            echo "ERROR: Failed to resolve monitoring EC2 instance ID."
            exit 1
          fi

          echo "APP_INSTANCE_ID=$APP_INSTANCE_ID" >> "$GITHUB_ENV"
          echo "APP_PRIVATE_IP=$APP_PRIVATE_IP" >> "$GITHUB_ENV"
          echo "MONITORING_INSTANCE_ID=$MONITORING_INSTANCE_ID" >> "$GITHUB_ENV"

          echo "Resolved app private IP: $APP_PRIVATE_IP"
          echo "Resolved app instance: $APP_INSTANCE_ID"
          echo "Resolved monitoring instance: $MONITORING_INSTANCE_ID"

      - name: Deploy application with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$APP_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy task-manager API from GitHub Actions" \
            --parameters "commands=[
              \"curl -fSL https://raw.githubusercontent.com/RoiY123/devops-task-manager/${COMMIT_SHA}/scripts/ensure-instance-prerequisites.sh -o /tmp/ensure-instance-prerequisites.sh"\,
              \"bash /tmp/ensure-instance-prerequisites.sh; STATUS=\$?; rm -f /tmp/ensure-instance-prerequisites.sh; if [ \$STATUS -ne 0 ]; then exit \$STATUS; fi",
              \"curl -fSL https://raw.githubusercontent.com/RoiY123/devops-task-manager/${COMMIT_SHA}/scripts/deploy-app.sh -o /tmp/deploy-app.sh\",
              \"COMMIT_SHA=${COMMIT_SHA} IMAGE_TAG=${IMAGE_TAG} bash /tmp/deploy-app.sh; STATUS=\$?; rm -f /tmp/deploy-app.sh; exit \$STATUS\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$APP_INSTANCE_ID"; then

            echo "SSM deployment command failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$APP_INSTANCE_ID"

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$APP_INSTANCE_ID"

      - name: Verify production health
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error https://api.roiy.dev/health; then
              echo
              echo "Production health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt failed. Retrying..."
            sleep 5
          done

          echo "Production health check failed."
          exit 1

      - name: Deploy monitoring with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$MONITORING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy task-manager monitoring from GitHub Actions" \
            --parameters "commands=[
              \"curl -fSL https://raw.githubusercontent.com/RoiY123/devops-task-manager/${COMMIT_SHA}/scripts/ensure-instance-prerequisites.sh -o /tmp/ensure-instance-prerequisites.sh"\,
              \"bash /tmp/ensure-instance-prerequisites.sh; STATUS=\$?; rm -f /tmp/ensure-instance-prerequisites.sh; if [ \$STATUS -ne 0 ]; then exit \$STATUS; fi",
              \"curl -fSL https://raw.githubusercontent.com/RoiY123/devops-task-manager/${COMMIT_SHA}/scripts/deploy-monitoring.sh -o /tmp/deploy-monitoring.sh\",
              \"COMMIT_SHA=${COMMIT_SHA} APP_PRIVATE_IP=${APP_PRIVATE_IP} bash /tmp/deploy-monitoring.sh; STATUS=\$?; rm -f /tmp/deploy-monitoring.sh; exit \$STATUS\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$MONITORING_INSTANCE_ID"; then

            echo "SSM monitoring deployment command failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$MONITORING_INSTANCE_ID"

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$MONITORING_INSTANCE_ID"