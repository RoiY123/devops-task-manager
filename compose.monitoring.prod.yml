services:
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    extra_hosts:
      - "app-prod:${APP_PRIVATE_IP}"

    volumes:
      - ./monitoring/prod/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prod/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/prod/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/prod/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.33.1
    restart: unless-stopped

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./runtime/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data: